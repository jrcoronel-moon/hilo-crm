# Hilo CRM — full stack, one isolated container per component.
#
#   cp .env.example .env   # then fill it in (see comments there)
#   make up                # local: http://localhost:8080
#   production: docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d
#
# Networks:
#   edge  caddy ⇄ web, mcp            (the only network with published ports)
#   data  web, mcp, migrate, backup ⇄ db   (internal: no route to the internet)

name: hilo

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-app-env: &app-env
  DATABASE_URL: postgres://hilo_app:${HILO_APP_PASSWORD:?set HILO_APP_PASSWORD}@db:5432/hilo?sslmode=disable&pool_max_conns=20
  APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
  LISTEN_ADDR: ":8080"
  NO_COLOR: ${NO_COLOR:-}

services:
  db:
    <<: *hardening
    image: postgres:18-alpine
    user: "70:70" # the image's postgres user: no root, no gosu, no capabilities needed
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: hilo
      HILO_MIGRATOR_PASSWORD: ${HILO_MIGRATOR_PASSWORD:?set HILO_MIGRATOR_PASSWORD}
      HILO_APP_PASSWORD: ${HILO_APP_PASSWORD:?set HILO_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70
      - /tmp:uid=70,gid=70
    networks: [data]
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hilo"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources: { limits: { memory: 768m } }

  migrate:
    <<: *hardening
    build: { context: ., target: migrate, args: { GIT_SHA: "${GIT_SHA:-dev}" } }
    image: hilo-migrate:${GIT_SHA:-dev}
    restart: "no"
    environment:
      MIGRATOR_DATABASE_URL: postgres://hilo_migrator:${HILO_MIGRATOR_PASSWORD}@db:5432/hilo?sslmode=disable
      NO_COLOR: ${NO_COLOR:-}
    depends_on:
      db: { condition: service_healthy }
    networks: [data]

  web:
    <<: *hardening
    build: { context: ., target: web, args: { GIT_SHA: "${GIT_SHA:-dev}" } }
    image: hilo-web:${GIT_SHA:-dev}
    environment:
      <<: *app-env
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
      DEV_LOGIN_ENABLED: ${DEV_LOGIN_ENABLED:-false}
      HILO_UI: ${HILO_UI:-full}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [edge, data]
    deploy:
      resources: { limits: { memory: 256m } }

  mcp:
    <<: *hardening
    build: { context: ., target: mcp, args: { GIT_SHA: "${GIT_SHA:-dev}" } }
    image: hilo-mcp:${GIT_SHA:-dev}
    environment: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [edge, data]
    deploy:
      resources: { limits: { memory: 256m } }

  caddy:
    <<: *hardening
    image: caddy:2.10.2-alpine
    cap_add: ["NET_BIND_SERVICE"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost.localdomain}
    ports:
      - "127.0.0.1:${HILO_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
      mcp: { condition: service_healthy }
    networks: [edge]
    deploy:
      resources: { limits: { memory: 128m } }

  backup:
    <<: *hardening
    image: postgres:18-alpine
    user: "70:70"
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: hilo
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_DIR: /var/lib/postgresql/backups
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      # Mounted on the image's postgres-owned directory so the new volume is
      # created owned by uid 70 (the container runs without root).
      - backups:/var/lib/postgresql
    tmpfs: ["/tmp:uid=70,gid=70"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    deploy:
      resources: { limits: { memory: 256m } }

networks:
  edge: {}
  data:
    internal: true

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
  backups: {}
