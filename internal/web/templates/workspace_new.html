{{define "content"}}
<p class="muted">{{t "Un workspace agrupa empresas, contactos, oportunidades y pipelines de un equipo. Se crea con un pipeline de ventas y canales por defecto que después podés cambiar."}}</p>
<form method="post" action="/workspaces" class="stack">
  <input type="hidden" name="csrf" value="{{.View.Sess.CSRFToken}}">
  <label class="field">{{t "Nombre"}} <input name="name" required maxlength="120" placeholder="{{t "Mi empresa"}}"></label>
  <button class="btn primary">{{t "Crear workspace"}}</button>
</form>
{{end}}
