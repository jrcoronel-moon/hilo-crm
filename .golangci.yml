version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose       # unclosed HTTP response bodies
    - copyloopvar
    - dupl            # duplicated code blocks
    - durationcheck
    - errcheck
    - errorlint       # errors.Is/As instead of == / type assertions
    - exhaustive      # switch on enums covers every case
    - gocognit        # cognitive complexity
    - gocritic
    - gosec           # security issues
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - noctx           # HTTP requests without context
    - nolintlint      # every //nolint must name the linter and say why
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 45
    gosec:
      excludes:
        - G104 # covered by errcheck
    misspell:
      # Spanish UI copy is not English misspelled.
      ignore-rules: [momento, sesion, ciudad, contraseña, contactos, administrar, corporativo, responsable, organizacion, descripcion]
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: unused-parameter
        - name: error-strings
        - name: errorf
        - name: blank-imports
        - name: context-as-argument
        - name: unreachable-code
    exhaustive:
      default-signifies-exhaustive: true
  exclusions:
    generated: strict
    paths:
      - tmp # git-ignored scratch programs
    rules:
      # Test tables and fixtures are allowed to repeat themselves.
      - path: _test\.go
        linters: [dupl, gocognit, gosec, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jrcoronel-moon/hilo-crm
